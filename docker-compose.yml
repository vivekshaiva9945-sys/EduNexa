services:
  # CONTAINER 1: FRONTEND (Next.js)
  frontend:
    image: node:18-alpine
    container_name: edunexa-frontend
    restart: unless-stopped
    command: sh -c "echo 'Next.js Frontend Ready' && tail -f /dev/null"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - edunexa-network

  # CONTAINER 2: BACKEND (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edunexa-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://edunexa_admin:securepassword123@database:5432/edunexa_multi_tenant
      - DB_USER=edunexa_admin
      - DB_PASSWORD=securepassword123
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=edunexa_multi_tenant
      - ENVIRONMENT=development
    depends_on:
      database:
        condition: service_healthy
    networks:
      - edunexa-network

  # CONTAINER 3: DATABASE (Multi-Tenant PostgreSQL)
  database:
    image: postgres:15-alpine
    container_name: edunexa-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: edunexa_admin
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: edunexa_multi_tenant
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - edunexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U edunexa_admin -d edunexa_multi_tenant" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - edunexa-network

# Persistent data storage for PostgreSQL
volumes:
  edunexa_pgdata:
    driver: local

# Internal private bridge network for inter-container communication
networks:
  edunexa-network:
    driver: bridge
